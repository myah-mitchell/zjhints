[package]
name = "zjtaskbar"
# Not what a release is published as: a release build writes the version of
# the tag it builds into its own copy. Bumping this cuts nothing.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zjkit.workspace = true
ansi_term.workspace = true
zellij-tile.workspace = true

[features]
# Makes `draw_for_image` public, for tests elsewhere in the workspace that
# draw zjtaskbar into the docs images. The plugin itself never calls it, so
# the release build leaves it out.
images = []
