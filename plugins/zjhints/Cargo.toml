[package]
name = "zjhints"
# Not what a release is published as: builds.yml writes the version of the
# vX.Y.Z tag it builds into its own copy (see builds.toml). Bumping this cuts
# nothing.
version = "0.5.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zjkit.workspace = true
ansi_term.workspace = true
unicode-width.workspace = true
zellij-tile.workspace = true
zellij-tile-utils.workspace = true
zellij-utils.workspace = true

[dev-dependencies]
# The tests draw the images in docs/img. A dev-dependency's features stay out
# of the release build, so the wasm plugin does not compile the engine, nor
# `junk`, the options one test loads the plugin with.
zjkit = { workspace = true, features = ["images", "testing"] }
# The same tests draw zjtabs as the tab bar of the images showing a whole
# Zellij session. As a dev-dependency, zjtabs stays out of the release build.
zjtabs = { workspace = true, features = ["images"] }
