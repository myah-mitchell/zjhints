[package]
name = "zjtabs"
# Not what a release is published as: a release build writes the version of
# the tag it builds into its own copy. Bumping this cuts nothing.
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zjkit.workspace = true
ansi_term.workspace = true
unicode-width.workspace = true
zellij-tile.workspace = true
zellij-tile-utils.workspace = true
zellij-utils.workspace = true

[dev-dependencies]
# A dev-dependency's features stay out of the release build, so the wasm
# plugin does not compile `junk`, the options one test loads the plugin with.
zjkit = { workspace = true, features = ["testing"] }
