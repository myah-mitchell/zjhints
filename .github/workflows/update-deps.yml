---
name: Update dependencies
on:
  schedule:
    # 04:00 UTC, an hour before the nightly build, so a merged update is
    # already in main by the time the nightly runs.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # Branch is reused, so a rerun updates the open PR instead of opening another.
  BRANCH: deps/auto-update

jobs:
  update:
    name: update
    runs-on: ubuntu-latest
    outputs:
      zellij_minor_available: ${{ steps.deps.outputs.zellij_minor_available }}
      zellij_tile_latest: ${{ steps.deps.outputs.zellij_tile_latest }}
      zellij_tile_utils_latest: ${{ steps.deps.outputs.zellij_tile_utils_latest }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not start any workflows.
      # With required status checks on main, that leaves the checks pending
      # forever and the pull request unmergeable. An app installation token
      # makes them run, and it also attributes the PR to the app's own bot
      # identity instead of whoever generated the token.
      - name: Check for the automation app credentials
        run: |
          if [ -z "${{ secrets.AUTOMATION_APP_ID }}" ] || [ -z "${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}" ]; then
            echo "::error::AUTOMATION_APP_ID/AUTOMATION_APP_PRIVATE_KEY are" \
                 "not set. Without them the pull request opens but CI never" \
                 "runs on it, so its required checks can never pass. See" \
                 "docs/AUTOMATION.md."
            exit 1
          fi

      - name: Generate an app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is the deprecated name for this input; the App ID value
          # works the same either way.
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.96.0"
          target: wasm32-wasip1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # `nix flake update` (no args) moves every input, not just rust-overlay —
      # this is what stops flake.lock going stale relative to Cargo.toml's
      # rust-version the way it did in #11, and keeps crane/nixpkgs/etc. fresh
      # the same way `cargo update` below keeps Cargo.lock fresh.
      - name: Update flake inputs
        id: flake
        run: |
          set -euo pipefail
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Confirms the update did not leave rust-overlay resolving a toolchain
      # too old for Cargo.toml's rust-version — flake.nix asserts that itself
      # (see #11), so a stale resolution fails here with a clear message
      # instead of silently landing in the PR.
      - name: Verify the flake still builds
        if: steps.flake.outputs.changed == 'true'
        run: nix build .#default --no-link --print-build-logs

      - name: Record current versions
        id: before
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, ".github/scripts")
          from check_deps import direct_dependencies, locked_versions
          deps = direct_dependencies(open("Cargo.toml").read())
          locked = locked_versions(open("Cargo.lock").read())
          print("versions=" + json.dumps({d: locked[d] for d in deps if d in locked}))
          EOF

      # Moves each dependency to the newest release its Cargo.toml requirement
      # allows. For 0.x crates that is patch-only, which is the policy for the
      # Zellij crates and a safe default for the rest.
      - name: Update dependencies
        run: cargo update

      - name: Summarise what changed
        id: deps
        run: python3 .github/scripts/check_deps.py '${{ steps.before.outputs.versions }}'

      - name: Ensure OpenSSL headers
        if: steps.deps.outputs.changed == 'true' || steps.flake.outputs.changed == 'true'
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          fi

      # Proven green before the PR is opened, so a red PR means CI found
      # something this job did not.
      - name: Test
        if: steps.deps.outputs.changed == 'true' || steps.flake.outputs.changed == 'true'
        run: cargo test --all-features

      - name: Build
        if: steps.deps.outputs.changed == 'true' || steps.flake.outputs.changed == 'true'
        run: cargo build --release --target=wasm32-wasip1

      - name: Open or update the pull request
        if: steps.deps.outputs.changed == 'true' || steps.flake.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Both default to github.actor otherwise, which is whoever (or
          # whatever schedule edit) GitHub attributes the triggering event
          # to - not necessarily the app, and not reliably a bot at all.
          # Pinning both here means the commit is unmistakably automation's,
          # regardless of how the run was triggered.
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: ${{ env.BRANCH }}
          delete-branch: true
          base: main
          commit-message: |
            chore(deps): update dependencies

            Opened automatically by .github/workflows/update-deps.yml.
            Tests and a release build passed before this was raised.
          title: "chore(deps): update dependencies"
          labels: |
            dependencies
            ${{ steps.deps.outputs.zellij_minor_available == 'true' && 'needs-zellij-upgrade' || '' }}
          body: |
            Automated dependency update. This does not touch `Cargo.toml`'s
            `version`, so merging it does not publish anything: bump the
            version yourself (see [docs/AUTOMATION.md](docs/AUTOMATION.md#versioning))
            whenever you're ready to cut a release that includes it.

            ${{ steps.deps.outputs.summary }}
            ${{ steps.flake.outputs.changed == 'true' && '`flake.lock` was refreshed (`nix flake update`) and confirmed to still build.' || '' }}

            <details>
            <summary>What ran before this was opened</summary>

            - `cargo update` — semver-compatible updates only
            - `cargo test --all-features`
            - `cargo build --release --target=wasm32-wasip1`
            ${{ steps.flake.outputs.changed == 'true' && '- `nix flake update`, then `nix build .#default` to confirm it still resolves' || '' }}

            </details>

            Merge when you have had time to look at it; CI must be green
            first.

      # Surfaced in the run as well as on the pull request, because this is the
      # one update that is not safe to take on its own — the crates have to move
      # in step with the Zellij actually installed.
      - name: Warn about a Zellij minor release
        if: steps.deps.outputs.zellij_minor_available == 'true'
        run: |
          echo "::warning::A Zellij crate has a new minor release. Upgrade" \
               "Zellij before taking this update — a mismatch shows up as" \
               "hints with wrong labels, not as a build failure."

  # `cargo update` above never proposes this move on its own — zellij-tile's
  # requirement caps it at a minor deliberately (PINNED_TO_ZELLIJ in
  # check_deps.py), because a zellij-tile ahead of the Zellij you actually run
  # drops actions it cannot decode at the plugin boundary, silently: hints
  # render with the wrong label, not a build error. So this proposes the move
  # instead of applying it, as its own pull request that needs a human who has
  # already upgraded their running Zellij to merge it — never on a green build
  # alone. Kept separate from the `update` job above rather than folded into
  # its conditionals: a different branch, a different reviewer action, and a
  # title/body that says "wait" instead of "merge when ready".
  zellij-upgrade:
    name: zellij-upgrade
    needs: update
    if: needs.update.outputs.zellij_minor_available == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      BRANCH: deps/zellij-upgrade
    steps:
      - name: Check for the automation app credentials
        run: |
          if [ -z "${{ secrets.AUTOMATION_APP_ID }}" ] || [ -z "${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}" ]; then
            echo "::error::AUTOMATION_APP_ID/AUTOMATION_APP_PRIVATE_KEY are" \
                 "not set. See docs/AUTOMATION.md."
            exit 1
          fi

      - name: Generate an app installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is the deprecated name for this input; the App ID value
          # works the same either way.
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.96.0"
          target: wasm32-wasip1

      # Widens the requirement itself - the one move `cargo update` cannot
      # make on its own - then re-resolves just these two crates so
      # Cargo.lock picks up the new version within the widened range.
      - name: Bump zellij-tile past the minor
        id: zellij
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import re
          text = open("Cargo.toml").read()
          targets = {
              "zellij-tile": "${{ needs.update.outputs.zellij_tile_latest }}",
              "zellij-tile-utils": "${{ needs.update.outputs.zellij_tile_utils_latest }}",
          }
          for crate, version in targets.items():
              if not version:
                  continue
              pattern = re.compile(rf'^{re.escape(crate)} = "[^"]+"', re.M)
              text = pattern.sub(f'{crate} = "{version}"', text)
          open("Cargo.toml", "w").write(text)
          EOF
          cargo update -p zellij-tile -p zellij-tile-utils
          # major.minor of the target version, for the PR body and the
          # compatibility tag release.yml will move once this is merged.
          # Prefer zellij-tile's own version; the two are released in lockstep
          # by the Zellij project, but fall back to zellij-tile-utils in case
          # only one reported a new version this run.
          target="${{ needs.update.outputs.zellij_tile_latest }}"
          target="${target:-${{ needs.update.outputs.zellij_tile_utils_latest }}}"
          echo "line=$(echo "$target" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Ensure OpenSSL headers
        run: |
          if ! pkg-config --exists openssl; then
            sudo apt-get update && sudo apt-get install -y libssl-dev
          fi

      # Expected to plausibly fail - that is the point. A red PR here is a
      # louder, harder-to-miss signal than the warning above, which only
      # ever reaches a run log nobody is watching.
      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release --target=wasm32-wasip1

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # See the same fields in the update job above: pinned so the
          # commit is unmistakably automation's regardless of who or what
          # triggered the run.
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: ${{ env.BRANCH }}
          delete-branch: true
          base: main
          commit-message: |
            chore(deps)!: bump zellij-tile to ${{ needs.update.outputs.zellij_tile_latest }}

            Opened automatically by the zellij-upgrade job in
            .github/workflows/update-deps.yml. Do not merge until the Zellij
            you run is on ${{ steps.zellij.outputs.line }} - see the pull
            request body.
          title: "chore(deps)!: Zellij ${{ steps.zellij.outputs.line }} is out - bump zellij-tile"
          labels: |
            dependencies
            needs-zellij-upgrade
          body: |
            A new Zellij minor is out: `zellij-tile`/`zellij-tile-utils` can
            move from their current pin to
            **${{ needs.update.outputs.zellij_tile_latest }}**.

            **Do not merge this until the Zellij you run is on
            ${{ steps.zellij.outputs.line }}.** Zellij's plugin boundary
            decodes a binding's actions with
            `.filter_map(|a| a.try_into().ok())`, so an action an older
            zellij-tile does not recognise is dropped silently - hints render
            with the wrong label, not an error. See
            [CONTRIBUTING.md](CONTRIBUTING.md#keeping-zellij-tile-in-step-with-zellij).

            This does not touch `Cargo.toml`'s `version`. Once merged, bump
            it yourself when you're ready to release (a minor bump is the
            convention for a Zellij line move), and pushing that bump to
            `main` (or tagging it) is what makes `release.yml` publish and
            moves the `zellij-${{ steps.zellij.outputs.line }}` compatibility
            tag. See
            [docs/AUTOMATION.md](docs/AUTOMATION.md#versioning).

            <details>
            <summary>What ran before this was opened</summary>

            - Widened `zellij-tile`/`zellij-tile-utils` to the new version
            - `cargo test --all-features`
            - `cargo build --release --target=wasm32-wasip1`

            (A failure in either of the last two is expected if this needs
            source changes to compile against the new zellij-tile - check
            the Checks tab.)

            </details>
