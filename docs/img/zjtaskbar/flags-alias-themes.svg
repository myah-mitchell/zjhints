<title>Five floating panes as pills after the launcher's button: the focused editor, notes minimized, cargo build exited, the filepicker plugin, and man zellij in the docs tab. With the zellij alias theme the button reads Menu and the flags read (MINIMIZED), (EXITED) and (PLUGIN), with none for the other tab; with ascii the button is a plus and the flags are _, X, P and @docs; with unicode the button is three bars and the flags are a down arrow, a cross, a gear and an up-right arrow before docs</title>
