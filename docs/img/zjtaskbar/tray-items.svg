<title>Five zjtaskbar bars with a tray at the right end. With the mode, the session and the clock in the Zellij theme's colors the tray reads NORMAL, work and 09:41 as blocks. With the flat theme each item is a block, with NORMAL in the mode's green and work in the accent color. With the powerline theme in locked mode the mode reads LOCKED in red, and each item sits behind an arrow pointing back at the entries. With the pills theme each item is a half-pill, rounded on the side facing the entries. The last bar shows only the session and a clock reading Tue 03 Nov 09:41</title>
