[workspace]
members = ["crates/zjkit", "plugins/zjhints", "plugins/zjtabs"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"

# Every dependency's version lives here, so a bump is one edit and the
# workflows that read or rewrite these requirements only look at this file.
[workspace.dependencies]
ansi_term = "0.12"
unicode-width = "0.2"
zellij-tile = "0.46.0"
zellij-tile-utils = "0.46.0"
# For the config-file block builders (plugin_aliases_kdl) the settings screen
# saves through; zellij-tile already builds it, so it adds nothing to compile.
zellij-utils = "0.46.0"
zjkit = { path = "crates/zjkit" }

# Override: myah-mitchell/zellij's fork-ea-v0.46.7-261103 is its early-access
# build. It is upstream main, which has the nested-session, plugin-collapse,
# context menu/prompt, config-save, popup outside-click and settings-entry APIs
# (all merged upstream but not yet published to crates.io), plus the fork's own
# plugin API work that is not merged upstream, such as middle clicks for
# plugins. A plugin built against it still runs on a Zellij without that work
# as long as it only uses calls that Zellij has. Remove this block once a
# zellij-tile/zellij-tile-utils release on crates.io has everything the plugins
# use (see docs/automation.md#depending-on-an-unreleased-upstream-fix).
[patch.crates-io]
zellij-tile = { git = "https://github.com/myah-mitchell/zellij", tag = "fork-ea-v0.46.7-261103" }
zellij-tile-utils = { git = "https://github.com/myah-mitchell/zellij", tag = "fork-ea-v0.46.7-261103" }
zellij-utils = { git = "https://github.com/myah-mitchell/zellij", tag = "fork-ea-v0.46.7-261103" }
