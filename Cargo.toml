[package]
name = "zjhints"
# Not what a release is published as: builds.yml writes the version of the
# vX.Y.Z tag it builds into its own copy (see builds.toml). Bumping this cuts
# nothing.
version = "0.5.2"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[dependencies]
ansi_term = "0.12"
unicode-width = "0.2"
zellij-tile = "0.46.0"
zellij-tile-utils = "0.46.0"
# For the config-file block builders (plugin_aliases_kdl) the settings screen
# saves through; zellij-tile already builds it, so it adds nothing to compile.
zellij-utils = "0.46.0"
