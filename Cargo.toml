[package]
name = "zjstatus-hints"
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.96"

[dependencies]
ansi_term = "0.12"
unicode-width = "0.2"
zellij-tile = "0.46.0"
zellij-tile-utils = "0.46.0"

# EA/beta override: myah-mitchell/zellij's fork-v0.46.1 carries a nested-
# session/headless-plugin fix not yet published to crates.io. Remove this
# block once zellij-tile/zellij-tile-utils ship it upstream (see
# docs/automation.md#depending-on-an-unreleased-upstream-fix).
[patch.crates-io]
zellij-tile = { git = "https://github.com/myah-mitchell/zellij", tag = "fork-v0.46.1" }
zellij-tile-utils = { git = "https://github.com/myah-mitchell/zellij", tag = "fork-v0.46.1" }
